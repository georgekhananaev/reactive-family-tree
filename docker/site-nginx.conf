# Serves the built site. A proxy in front of it gives it https and its address.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # A folder asked for without its slash is sent on with a relative address, which stays right behind the proxy
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Astro names these files after their contents, so a browser can keep them for good
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
