name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The same build the Docker image runs, so a release is never the first time the app is built
      - run: pnpm --filter @reactive-family-tree/web build
      - run: pnpm --filter @reactive-family-tree/site build

  # A push to main that passes the checks goes live on its own. The image is built here, on the
  # kind of processor the server has, so the server only fetches it and swaps the container.
  # A push to dev builds it too, for the public demo, and never reaches the family's tree.
  image:
    if: github.event_name == 'push' && github.repository == 'georgekhananaev/reactive-family-tree'
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # One plain image with no attestation beside it, so that each push is one version to keep or tidy away
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The tree says which build it is, in the small window behind its version
          build-args: |
            REVISION=${{ github.sha }}
            BUILT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The server keeps the builds that are live and the ones before them. Here the last ten are
      # enough, as main and dev both add to them, and tidying is not worth failing a deploy over.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10

  # Only main reaches the family's tree
  deploy:
    if: github.ref_name == 'main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # One deploy at a time. A newer push waits its turn instead of racing this one.
    concurrency: deploy
    steps:
      - name: Put this build live
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          # A run that was overtaken leaves the server to the newer one
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head, and its own run puts that live."
            exit 0
          fi
          # The hook is an n8n workflow that has the server fetch the image and swap the container.
          # The token is what the server fetches with. It can read this repository's packages and
          # nothing more, and it stops working when this job ends.
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --max-time 120 --output answer.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data "{\"revision\":\"$GITHUB_SHA\",\"pass\":\"$GH_TOKEN\"}" "$HOOK") || status=000
            if [ "$status" = 200 ]; then break; fi
            echo "Attempt $attempt: the server answered $status."
            if [ "$attempt" != 3 ]; then sleep 15; fi
          done
          [ "$status" = 200 ]
          jq --raw-output .message answer.json
          jq --exit-status .ok answer.json > /dev/null

  # The public demo: the project site and the whole app with the made-up Marlow family, side by side
  # on the same server as the family's tree. A push to dev builds the site and puts both live.
  site-image:
    if: github.event_name == 'push' && github.ref_name == 'dev' && github.repository == 'georgekhananaev/reactive-family-tree'
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/site.Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}-site:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SITE_URL=https://familytree.reactatomics.com
            DEMO_APP_URL=https://demo-familytree.reactatomics.com
            GA_ID=G-BTXXZTYX02
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-site
          package-type: container
          min-versions-to-keep: 5

  demo:
    needs: [image, site-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency: demo
    steps:
      - uses: actions/checkout@v4
      - name: Put the site and the app demo live
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.DEMO_HOOK_URL }}
        run: .github/deploy-hook.sh

  # A version and the changelog change in one place only, the release commit on main, so two
  # branches can never collide over them. A release that has to come through a pull request
  # is made on a branch named release-something.
  release-files:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No version or changelog change in a pull request
        env:
          BASE: ${{ github.base_ref }}
        run: |
          notes=$(git diff --name-only "origin/$BASE"...HEAD -- CHANGELOG.md changelog)
          versions=$(git diff -U0 --diff-filter=M "origin/$BASE"...HEAD -- '*package.json' | grep -E '^-[[:space:]]*"version":' || true)
          if [ -n "$notes$versions" ]; then
            echo "::error::This pull request changes a version or the changelog. Both change only in a release on main. See CONTRIBUTING.md."
            exit 1
          fi
