<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Reactive Family Tree v4: Fan-shaped Ginkgo crown (with a golden Ginkgo leaf) and slender Olive lower leaves. Author: George Khananaev -->
  <style>
    .root { fill: #3A3028; opacity: 0.34; }
    .ground { fill: none; stroke: #3A3028; stroke-opacity: 0.48; stroke-width: 1.4; stroke-linecap: round; }
    .bark { fill: #3A3028; }
    .blade { stroke: #14261F; stroke-opacity: 0.52; stroke-width: 1.5; stroke-linejoin: round; }
    .vein { fill: none; stroke: #14261F; stroke-opacity: 0.38; stroke-width: 1.6; stroke-linecap: round; }
    .vein-gold { fill: none; stroke: #5A3F0C; stroke-opacity: 0.48; stroke-width: 1.6; stroke-linecap: round; }
    .l0 { fill: #2F6B4F; } .l1 { fill: #3A7853; } .l2 { fill: #508C58; } .l3 { fill: #6FA560; } .l4 { fill: #8DBF6A; }
    .gold { fill: #C9992E; } .gold2 { fill: #D4A742; }
    .wash-light { stop-color: #FFFFFF; } .wash-shade { stop-color: #14261F; }
    .petal { fill: #E58FA6; stroke: #A9506A; stroke-width: 0.75; } .heart { fill: #C9992E; }
    @media (prefers-color-scheme: dark) {
      .root { fill: #8491B4; opacity: 0.28; }
      .ground { stroke: #8491B4; stroke-opacity: 0.45; }
      .bark { fill: #8491B4; }
      .blade { stroke: #F1FBF3; stroke-opacity: 0.55; }
      .vein { stroke: #0C1322; stroke-opacity: 0.38; }
      .vein-gold { stroke: #4E3B0E; stroke-opacity: 0.5; }
      .l0 { fill: #8FD0A8; } .l1 { fill: #A3D9B5; } .l2 { fill: #BFE3C8; } .l3 { fill: #CDEBCB; } .l4 { fill: #DCF3D2; }
      .gold { fill: #E3C77A; } .gold2 { fill: #EBD08C; }
      .wash-light { stop-color: #FFFFFF; } .wash-shade { stop-color: #0C1322; }
      .petal { fill: #F2A7BA; stroke: #FBD5DE; } .heart { fill: #F3D36B; }
    }
  </style>
