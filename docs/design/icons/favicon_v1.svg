<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A small family tree: tapered botanical trunk and limbs, five beech leaves in the tree's own colours with watercolour wash and veins, and a union blossom at the fork. Author: George Khananaev -->
  <style>
    .bark { fill: #3A3028; }
    .blade { stroke: #14261F; stroke-opacity: 0.52; stroke-width: 1.5; stroke-linejoin: round; }
    .vein { fill: none; stroke: #14261F; stroke-opacity: 0.38; stroke-width: 1.65; stroke-linecap: round; }
    .vein-gold { fill: none; stroke: #5A3F0C; stroke-opacity: 0.48; stroke-width: 1.65; stroke-linecap: round; }
    .l0 { fill: #2F6B4F; } .l1 { fill: #3A7853; } .l2 { fill: #508C58; } .l3 { fill: #6FA560; } .gold { fill: #C9992E; }
    .wash-light { stop-color: #FFFFFF; } .wash-shade { stop-color: #14261F; }
    .petal { fill: #E58FA6; stroke: #A9506A; stroke-width: 0.75; } .heart { fill: #C9992E; }
    @media (prefers-color-scheme: dark) {
      .bark { fill: #8491B4; }
      .blade { stroke: #F1FBF3; stroke-opacity: 0.55; }
      .vein { stroke: #0C1322; stroke-opacity: 0.38; }
      .vein-gold { stroke: #4E3B0E; stroke-opacity: 0.5; }
      .l0 { fill: #8FD0A8; } .l1 { fill: #A3D9B5; } .l2 { fill: #BFE3C8; } .l3 { fill: #CDEBCB; } .gold { fill: #E3C77A; }
      .wash-light { stop-color: #FFFFFF; } .wash-shade { stop-color: #0C1322; }
      .petal { fill: #F2A7BA; stroke: #FBD5DE; } .heart { fill: #F3D36B; }
    }
  </style>
  <defs>
    <radialGradient id="wash" cx="36%" cy="32%" r="72%">
      <stop class="wash-light" offset="0" stop-opacity="0.42"/>
      <stop class="wash-light" offset="0.55" stop-opacity="0.05"/>
      <stop class="wash-shade" offset="1" stop-opacity="0.18"/>
    </radialGradient>

    <g id="leaf">
      <path class="blade" d="M0,0 C-16.5,-10 -18.5,-34 0,-50 C18.5,-34 16.5,-10 0,0 Z"/>
      <path d="M0,0 C-16.5,-10 -18.5,-34 0,-50 C18.5,-34 16.5,-10 0,0 Z" fill="url(#wash)"/>
      <path class="vein" d="M0,-1 L0,-44 M0,-14 L-8,-22 M0,-14 L8,-22 M0,-27 L-7.5,-34.5 M0,-27 L7.5,-34.5"/>
    </g>

    <g id="leaf-gold">
      <path class="blade gold" d="M0,0 C-16.5,-10 -18.5,-34 0,-50 C18.5,-34 16.5,-10 0,0 Z"/>
      <path d="M0,0 C-16.5,-10 -18.5,-34 0,-50 C18.5,-34 16.5,-10 0,0 Z" fill="url(#wash)"/>
      <path class="vein-gold" d="M0,-1 L0,-44 M0,-14 L-8,-22 M0,-14 L8,-22 M0,-27 L-7.5,-34.5 M0,-27 L7.5,-34.5"/>
    </g>
  </defs>
  <!-- Seamless tapered trunk and limbs -->
  <g class="bark">
    <path d="M37.70,60.50 L37.06,58.74 L36.49,56.98 L35.98,55.20 L35.52,53.40 L35.11,51.58 L34.74,49.74 L34.42,47.88 L34.13,45.98 L33.87,44.06 L33.65,42.11 L33.46,40.12 L33.29,38.09 L33.14,36.03 L33.02,33.92 L32.91,31.76 L32.81,29.56 L32.73,27.31 L32.65,25.00 L31.35,25.00 L31.27,27.31 L31.19,29.56 L31.09,31.76 L30.98,33.92 L30.86,36.03 L30.71,38.09 L30.54,40.12 L30.35,42.11 L30.13,44.06 L29.87,45.98 L29.58,47.88 L29.26,49.74 L28.89,51.58 L28.48,53.40 L28.02,55.20 L27.51,56.98 L26.94,58.74 L26.30,60.50 Q32.00,61.70 37.70,60.50 Z"/>
    <path d="M33.69,41.06 L33.26,39.99 L32.75,39.02 L32.18,38.13 L31.54,37.33 L30.86,36.61 L30.13,35.95 L29.38,35.35 L28.60,34.79 L27.81,34.26 L27.00,33.75 L26.18,33.26 L25.37,32.76 L24.55,32.26 L23.73,31.73 L22.93,31.19 L22.14,30.60 L21.37,29.97 L20.62,29.29 L19.74,30.11 L20.46,30.92 L21.21,31.67 L21.97,32.38 L22.75,33.05 L23.53,33.69 L24.30,34.30 L25.05,34.89 L25.79,35.47 L26.49,36.05 L27.15,36.63 L27.76,37.22 L28.33,37.81 L28.83,38.43 L29.26,39.06 L29.63,39.72 L29.93,40.41 L30.16,41.14 L30.31,41.94 Z"/>
    <path d="M33.69,41.94 L33.84,41.14 L34.07,40.41 L34.37,39.72 L34.74,39.06 L35.17,38.43 L35.67,37.81 L36.24,37.22 L36.85,36.63 L37.51,36.05 L38.21,35.47 L38.95,34.89 L39.70,34.30 L40.47,33.69 L41.25,33.05 L42.03,32.38 L42.79,31.67 L43.54,30.92 L44.26,30.11 L43.38,29.29 L42.63,29.97 L41.86,30.60 L41.07,31.19 L40.27,31.73 L39.45,32.26 L38.63,32.76 L37.82,33.26 L37.00,33.75 L36.19,34.26 L35.40,34.79 L34.62,35.35 L33.87,35.95 L33.14,36.61 L32.46,37.33 L31.82,38.13 L31.25,39.02 L30.74,39.99 L30.31,41.06 Z"/>
    <path d="M33.47,48.46 L32.94,47.70 L32.38,47.03 L31.78,46.42 L31.15,45.90 L30.50,45.43 L29.83,45.03 L29.14,44.68 L28.45,44.36 L27.74,44.08 L27.02,43.82 L26.30,43.58 L25.57,43.35 L24.84,43.12 L24.11,42.88 L23.37,42.63 L22.63,42.37 L21.89,42.08 L21.16,41.77 L20.59,42.83 L21.33,43.25 L22.06,43.65 L22.79,44.02 L23.51,44.37 L24.22,44.71 L24.91,45.03 L25.58,45.36 L26.23,45.69 L26.84,46.02 L27.42,46.36 L27.97,46.72 L28.47,47.10 L28.93,47.50 L29.34,47.92 L29.71,48.36 L30.03,48.85 L30.30,49.37 L30.53,49.94 Z"/>
    <path d="M33.47,49.94 L33.70,49.37 L33.97,48.85 L34.29,48.36 L34.66,47.92 L35.07,47.50 L35.53,47.10 L36.03,46.72 L36.58,46.36 L37.16,46.02 L37.77,45.69 L38.42,45.36 L39.09,45.03 L39.78,44.71 L40.49,44.37 L41.21,44.02 L41.94,43.65 L42.67,43.25 L43.41,42.83 L42.84,41.77 L42.11,42.08 L41.37,42.37 L40.63,42.63 L39.89,42.88 L39.16,43.12 L38.43,43.35 L37.70,43.58 L36.98,43.82 L36.26,44.08 L35.55,44.36 L34.86,44.68 L34.17,45.03 L33.50,45.43 L32.85,45.90 L32.22,46.42 L31.62,47.03 L31.06,47.70 L30.53,48.46 Z"/>
  </g>

  <!-- Five beech leaves across the crown -->
  <use href="#leaf" class="l3" transform="translate(22.2,43.0) rotate(-62) scale(0.44)"/>
  <use href="#leaf-gold" transform="translate(41.8,43.0) rotate(62) scale(0.44)"/>
  <use href="#leaf" class="l0" transform="translate(21.2,30.8) rotate(-43) scale(0.48)"/>
  <use href="#leaf" class="l2" transform="translate(42.8,30.8) rotate(43) scale(0.48)"/>
  <use href="#leaf" class="l1" transform="translate(32,26.2) scale(0.5)"/>

  <!-- Union blossom at the main fork -->
  <g transform="translate(32,39.5) scale(0.82)">
    <ellipse class="petal" cx="0" cy="-5.2" rx="3.1" ry="4.7"/>
    <ellipse class="petal" cx="0" cy="-5.2" rx="3.1" ry="4.7" transform="rotate(72)"/>
    <ellipse class="petal" cx="0" cy="-5.2" rx="3.1" ry="4.7" transform="rotate(144)"/>
    <ellipse class="petal" cx="0" cy="-5.2" rx="3.1" ry="4.7" transform="rotate(216)"/>
    <ellipse class="petal" cx="0" cy="-5.2" rx="3.1" ry="4.7" transform="rotate(288)"/>
    <circle class="heart" r="2.2"/>
  </g>
</svg>
