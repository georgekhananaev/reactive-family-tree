<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Reactive Family Tree — Logo v1 ("Morning ink")
       A botanical plate emblem: ancestral roots below the soil line, sculpted tapered
       ink-and-bark trunk and limbs, nine leaves across generations (living greens,
       sprout green, and remembered gold, including grafted olive), watercolour washes,
       and union blossoms at the forks.
       Author: George Khananaev -->
  <style>
    .canopy-aura { opacity: 0.95; }
    .night-glow { opacity: 0; }
    .root { fill: #3A3028; opacity: 0.34; }
    .ground { fill: none; stroke: #3A3028; stroke-opacity: 0.55; stroke-width: 2.2; stroke-linecap: round; }
    .grass { fill: none; stroke: #2F6B4F; stroke-opacity: 0.6; stroke-width: 2; stroke-linecap: round; }
    .bark { fill: #3A3028; }
    .blade { stroke: #14261F; stroke-opacity: 0.52; stroke-width: 1.25; stroke-linejoin: round; }
    .vein { fill: none; stroke: #14261F; stroke-opacity: 0.36; stroke-width: 1.2; stroke-linecap: round; }
    .vein-gold { fill: none; stroke: #5A3F0C; stroke-opacity: 0.46; stroke-width: 1.2; stroke-linecap: round; }
    .l0 { fill: #2F6B4F; }
    .l1 { fill: #3A7853; }
    .l2 { fill: #508C58; }
    .l3 { fill: #6FA560; }
    .l4 { fill: #8DBF6A; }
    .gold0 { fill: #C9992E; }
    .gold1 { fill: #D4A742; }
    .wash-light { stop-color: #FFFFFF; }
    .wash-shade { stop-color: #14261F; }
    .petal { fill: #E58FA6; stroke: #A9506A; stroke-width: 0.65; }
    .heart { fill: #C9992E; }
    .firefly { opacity: 0; }

    @media (prefers-color-scheme: dark) {
      .canopy-aura { opacity: 0; }
      .night-glow { opacity: 0.6; }
      .root { fill: #8491B4; opacity: 0.26; }
      .ground { stroke: #8491B4; stroke-opacity: 0.5; }
      .grass { stroke: #5E9C7C; stroke-opacity: 0.6; }
      .bark { fill: #8491B4; }
      .blade { stroke: #F1FBF3; stroke-opacity: 0.55; }
      .vein { stroke: #0C1322; stroke-opacity: 0.35; }
      .vein-gold { stroke: #4E3B0E; stroke-opacity: 0.48; }
      .l0 { fill: #8FD0A8; }
      .l1 { fill: #A3D9B5; }
      .l2 { fill: #BFE3C8; }
      .l3 { fill: #CDEBCB; }
      .l4 { fill: #DCF3D2; }
      .gold0 { fill: #E3C77A; }
      .gold1 { fill: #EBD08C; }
      .wash-light { stop-color: #FFFFFF; }
      .wash-shade { stop-color: #0C1322; }
      .petal { fill: #F2A7BA; stroke: #FBD5DE; }
      .heart { fill: #F3D36B; }
      .firefly { opacity: 0.88; }
    }
  </style>

  <defs>
    <!-- Soft morning watercolour wash behind the crown -->
    <radialGradient id="canopyAura" cx="50%" cy="44%" r="46%">
      <stop offset="0" stop-color="#8DBF6A" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#8DBF6A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8DBF6A" stop-opacity="0"/>
    </radialGradient>

    <!-- Night moonleaf inner glow -->
    <radialGradient id="nightAura" cx="50%" cy="44%" r="48%">
      <stop offset="0" stop-color="#8FD3A6" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#7CCDE0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0C1322" stop-opacity="0"/>
    </radialGradient>

    <!-- Watercolour wash inside each leaf blade -->
    <radialGradient id="wash" cx="38%" cy="34%" r="72%">
      <stop class="wash-light" offset="0" stop-opacity="0.45"/>
      <stop class="wash-light" offset="0.55" stop-opacity="0.06"/>
      <stop class="wash-shade" offset="1" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Firefly glow for dark mode -->
    <radialGradient id="fireflyGlow">
      <stop offset="0" stop-color="#FFF7D6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#F3D36B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F3D36B" stop-opacity="0"/>
    </radialGradient>

    <!-- Beech leaf (signature lineage species) -->
    <g id="beech">
      <path class="blade" d="M0,0 C-18,-12 -20,-38 0,-58 C20,-38 18,-12 0,0 Z"/>
      <path d="M0,0 C-18,-12 -20,-38 0,-58 C20,-38 18,-12 0,0 Z" fill="url(#wash)"/>
      <path class="vein" d="M0,-1 L0,-52 M0,-12 L-10,-21 M0,-12 L10,-21 M0,-23 L-12,-33 M0,-23 L12,-33 M0,-34 L-9.5,-43 M0,-34 L9.5,-43 M0,-44 L-5.5,-50 M0,-44 L5.5,-50"/>
    </g>

    <!-- Beech leaf in remembered Gold -->
    <g id="beech-gold">
      <path class="blade" d="M0,0 C-18,-12 -20,-38 0,-58 C20,-38 18,-12 0,0 Z"/>
      <path d="M0,0 C-18,-12 -20,-38 0,-58 C20,-38 18,-12 0,0 Z" fill="url(#wash)"/>
      <path class="vein-gold" d="M0,-1 L0,-52 M0,-12 L-10,-21 M0,-12 L10,-21 M0,-23 L-12,-33 M0,-23 L12,-33 M0,-34 L-9.5,-43 M0,-34 L9.5,-43 M0,-44 L-5.5,-50 M0,-44 L5.5,-50"/>
    </g>

    <!-- Olive leaf (grafted partner species) -->
    <g id="olive">
      <path class="blade" d="M0,0 C-11.5,-14 -12.5,-40 0,-60 C12.5,-40 11.5,-14 0,0 Z"/>
      <path d="M0,0 C-11.5,-14 -12.5,-40 0,-60 C12.5,-40 11.5,-14 0,0 Z" fill="url(#wash)"/>
      <path class="vein" d="M0,-1 L0,-54 M0,-18 L-6,-26 M0,-18 L6,-26 M0,-33 L-6,-41 M0,-33 L6,-41"/>
    </g>

    <!-- Five-petal union blossom -->
    <g id="blossom">
      <ellipse class="petal" cx="0" cy="-6.2" rx="3.5" ry="5.4"/>
      <ellipse class="petal" cx="0" cy="-6.2" rx="3.5" ry="5.4" transform="rotate(72)"/>
      <ellipse class="petal" cx="0" cy="-6.2" rx="3.5" ry="5.4" transform="rotate(144)"/>
      <ellipse class="petal" cx="0" cy="-6.2" rx="3.5" ry="5.4" transform="rotate(216)"/>
      <ellipse class="petal" cx="0" cy="-6.2" rx="3.5" ry="5.4" transform="rotate(288)"/>
      <circle class="heart" r="2.4"/>
    </g>
  </defs>

  <!-- Subtle atmospheric wash behind the crown -->
  <ellipse class="canopy-aura" cx="128" cy="108" rx="112" ry="96" fill="url(#canopyAura)"/>
  <ellipse class="night-glow" cx="128" cy="108" rx="112" ry="96" fill="url(#nightAura)"/>

