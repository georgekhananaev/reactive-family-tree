  <!-- Nine leaves across three generations -->
  <!-- Generation 1: Lower heritage pair (one remembered gold, one deep green) -->
  <use href="#beech-gold" class="gold0" transform="translate(84,165) rotate(-80) scale(0.86)"/>
  <use href="#beech" class="l1" transform="translate(172,165) rotate(80) scale(0.86)"/>

  <!-- Generation 2: Outer lower-mid leaves (living green & young sprout) -->
  <use href="#beech" class="l3" transform="translate(64,134) rotate(-72) scale(0.94)"/>
  <use href="#beech" class="l4" transform="translate(192,134) rotate(72) scale(0.94)"/>

  <!-- Generation 2/3: Mid-canopy bough leaves (deep canopy green & remembered gold) -->
  <use href="#beech" class="l0" transform="translate(64,96) rotate(-50) scale(1.04)"/>
  <use href="#beech-gold" class="gold1" transform="translate(192,96) rotate(50) scale(1.04)"/>

  <!-- Generation 3: Upper inner crown leaves (beech & grafted partner olive) -->
  <use href="#beech" class="l2" transform="translate(86,75) rotate(-24) scale(1.06)"/>
  <use href="#olive" class="l3" transform="translate(170,75) rotate(24) scale(1.08)"/>

  <!-- Crown Apex leaf -->
  <use href="#beech" class="l1" transform="translate(128,72) scale(1.14)"/>

  <!-- Three union blossoms at the founding and secondary forks -->
  <use href="#blossom" transform="translate(97,118) rotate(-18) scale(1.18)"/>
  <use href="#blossom" transform="translate(159,118) rotate(18) scale(1.18)"/>
  <use href="#blossom" transform="translate(128,144) scale(1.55)"/>

  <!-- Night fireflies (visible in dark mode) -->
  <g class="firefly">
