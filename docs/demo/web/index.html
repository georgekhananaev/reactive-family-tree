<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Reactive Family Tree</title>
<link rel="icon" href="data:,">
<script>
  // Choose light or dark before anything is drawn: a saved choice first, otherwise the device setting.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('rft-appearance'); } catch (e) {}
    var fromAddress = /(?:^|[#&])theme=(light|dark)/.exec(location.hash);
    var theme = fromAddress ? fromAddress[1] : saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tree.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="stage">
  <div class="sky sky-light" aria-hidden="true"></div>
  <div class="sky sky-dark" aria-hidden="true"></div>
  <!-- Edit mode: a faint trellis behind the tree says "you are gardening now" -->
  <div class="trellis" aria-hidden="true"></div>
  <!-- Time travel: the year stands in the sky while the slider is away from today -->
  <div id="yearGhost" class="year-ghost" aria-hidden="true"></div>
  <div id="world">
    <div class="behind" aria-hidden="true"></div>
    <svg id="tree" aria-label="The family tree">
      <defs>
        <radialGradient id="wash" cx="38%" cy="34%" r="72%">
          <stop class="wash-light" offset="0" stop-opacity="0.5"/>
          <stop class="wash-light" offset="0.55" stop-opacity="0.06"/>
          <stop class="wash-shade" offset="1" stop-opacity="0.2"/>
        </radialGradient>
        <radialGradient id="leafGlow">
          <stop offset="0" stop-color="#BFE3C8" stop-opacity="0.55"/>
          <stop offset="0.45" stop-color="#8FD3A6" stop-opacity="0.18"/>
          <stop offset="1" stop-color="#8FD3A6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="warmGlow">
          <stop offset="0" stop-color="#F3D36B" stop-opacity="0.6"/>
          <stop offset="0.45" stop-color="#F3D36B" stop-opacity="0.18"/>
          <stop offset="1" stop-color="#F3D36B" stop-opacity="0"/>
        </radialGradient>
        <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
          <rect class="hatch-paper" width="5" height="5"/>
          <line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/>
        </pattern>
      </defs>
    </svg>
    <div class="ahead" aria-hidden="true"></div>
  </div>
</div>

<!-- The tree fades out under the controls instead of colliding with them -->
<div class="scrim scrim-top" aria-hidden="true"></div>
<div class="scrim scrim-bottom" aria-hidden="true"></div>

<header class="top">
  <div class="title">
    <h1 id="familyName"></h1>
    <p id="familyLine"></p>
    <p id="note" class="note" hidden></p>
  </div>
  <nav class="tools" aria-label="Tools">
    <button id="editToggle" type="button" class="tool" hidden aria-pressed="false" title="Edit the tree (E)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z M14 7l3 3"/></svg><span>Edit</span>
    </button>
    <button id="searchOpen" type="button" class="tool icon" aria-label="Search" title="Search (/)" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
    </button>
    <button id="inboxOpen" type="button" class="tool icon" aria-label="Inbox" title="Inbox" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6H4v-6z M4 13h5l1 2h4l1-2h5"/></svg><b class="badge" hidden></b>
    </button>
    <button id="menuOpen" type="button" class="tool" aria-haspopup="menu" aria-expanded="false"></button>
  </nav>
</header>

<div id="menu" class="menu panel" role="menu" hidden></div>
<div id="search" class="search panel" hidden>
  <input id="searchInput" type="search" placeholder="Search by name, year or place" autocomplete="off" aria-label="Search people" aria-controls="searchResults">
  <ul id="searchResults"></ul>
  <p class="search-keys" aria-hidden="true">Arrow keys to move, Enter to go, Esc to close</p>
</div>

<div id="banner" class="banner panel" hidden></div>
<div id="card" role="dialog" aria-label="Person" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Panel">
  <header><h2 id="drawerTitle"></h2><button id="drawerClose" type="button" class="close" aria-label="Close">×</button></header>
  <div id="drawerTabs" class="tabs" role="tablist"></div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>
<div id="toasts" aria-live="polite"></div>

<footer class="timebar panel">
  <button id="play" type="button" class="round" aria-label="Play the family growing" title="Play (P)"></button>
  <output id="yearOut" for="year"></output>
  <input id="year" type="range" aria-label="Year">
  <button id="today" type="button" class="small" hidden>Today</button>
</footer>

<nav class="zoom panel" aria-label="View">
  <button id="zoomIn" type="button" class="round" aria-label="Zoom in" title="Zoom in (+)"></button>
  <button id="zoomOut" type="button" class="round" aria-label="Zoom out" title="Zoom out (-)"></button>
  <button id="fit" type="button" class="round" aria-label="Show the whole tree" title="Whole tree (0)"></button>
  <button id="myLeaf" type="button" class="round" aria-label="Go to my leaf" title="My leaf (M)" hidden></button>
</nav>

<script type="module" src="js/main.js"></script>
</body>
</html>
